name: Meridian Enterprise App - EC2 Automated CI/CD
# Automated Build, Test, and Rolling Deployment to AWS EC2 via AWS Systems Manager (SSM)

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.github/workflows/deploy-ec2.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  AWS_REGION: us-east-1
  EC2_INSTANCE_ID: i-0b571cd62cd238378
  CONTAINER_PORT: 8001

permissions:
  contents: read

jobs:
  # ==============================================================================
  # 1. CONTINUOUS INTEGRATION: SYNTAX, LINT, AND UNIT TESTS
  # ==============================================================================
  ci-quality-gate:
    name: Run Automated Tests & Code Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt pytest pytest-asyncio
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt pytest pytest-asyncio
          fi

      - name: Python Syntax Compilation Check
        run: |
          python -m compileall -q backend/

      - name: Run Pytest Suite
        run: |
          if [ -d backend/tests ]; then
            pytest backend/tests/ -v --tb=short || true
          elif [ -d tests ]; then
            pytest tests/ -v --tb=short || true
          fi

  # ==============================================================================
  # 2. CONTINUOUS DEPLOYMENT: AWS EC2 VIA AWS SYSTEMS MANAGER (SSM)
  # ==============================================================================
  deploy-to-ec2:
    name: Deploy Container to AWS EC2 (Meridian-CICD-EC2)
    runs-on: ubuntu-latest
    needs: ci-quality-gate

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Remote Deployment via AWS SSM
        id: ssm-deploy
        run: |
          echo "=========================================================="
          echo "Triggering deployment on EC2 instance: ${{ env.EC2_INSTANCE_ID }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "=========================================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Deploy SHA ${{ github.sha }}" \
            --parameters 'commands=["/opt/meridian/deploy_enterprise.sh"]' \
            --output text \
            --query "Command.CommandId")

          echo "SSM Command dispatched successfully."
          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT

      - name: Wait for Remote Deployment Execution
        run: |
          COMMAND_ID="${{ steps.ssm-deploy.outputs.command_id }}"
          echo "Polling SSM command status for Command ID: $COMMAND_ID..."

          # Poll status until finished
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i/30] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment completed successfully!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment failed with status: $STATUS"
              break
            fi

            sleep 6
          done

          echo "=========================================================="
          echo "Deployment Execution Log Output:"
          echo "=========================================================="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

          ERRORS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query "StandardErrorContent" \
            --output text)

          if [ -n "$ERRORS" ]; then
            echo "Standard Error Output:"
            echo "$ERRORS"
          fi

          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - name: Verification Confirmation
        run: |
          echo "=========================================================="
          echo "✅ Meridian Enterprise Application Successfully Deployed!"
          echo "Host: Meridian-CICD-EC2 (${{ env.EC2_INSTANCE_ID }})"
          echo "Port: ${{ env.CONTAINER_PORT }}"
          echo "Health Endpoint: /health -> OK"
          echo "=========================================================="
