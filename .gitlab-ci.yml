# ==============================================================================
# GitLab CI/CD Pipeline - Meridian Enterprise Application
# ==============================================================================

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache dependencies across pipeline runs for faster execution
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - backend/bin/node_modules/

# Job: Automated Testing
test_enterprise_app:
  stage: test
  # Uses pre-built image with both Python 3.11 and Node.js 20 installed
  image: nikolaik/python-nodejs:python3.11-nodejs20

  before_script:
    - python --version
    - node --version
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pytest pytest-asyncio
    - cd backend/bin && npm install && cd ../..

  script:
    - pytest tests/ -v

  # Trigger on pushes to main and on Merge Requests (MRs)
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

